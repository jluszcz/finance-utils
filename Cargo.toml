[package]
name = "jluszcz_finance_utils"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"
description = "Code shared by Paychecker, MisterManager and Funder: money, config, the HTML report, S3 backups, the common CLI flags, and TUI text editing."
license = "MIT"
repository = "https://github.com/jluszcz/finance-utils"

[features]
money = ["dep:thiserror"]
config = ["dep:serde", "dep:toml"]
report = ["config", "dep:chrono", "dep:clap", "dep:minify-html"]
backup = ["config", "dep:chrono", "chrono/serde", "dep:clap", "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-types", "dep:tokio", "dep:zstd"]
scratch = ["dep:chrono"]
cli = ["config", "scratch", "dep:chrono", "dep:clap"]
sqlite = ["dep:rusqlite"]
tui = ["dep:ratatui", "dep:chrono"]
test-support = ["tui"]

[dependencies]
anyhow = "1.0"
# `default-https-client` is the rustls 0.23 stack; the SDK's `rustls` feature is the
# legacy hyper-0.14 client (rustls 0.21 / rustls-webpki 0.101), which no longer
# receives security fixes. aws-config's own https client is left off entirely
# rather than swapped.
aws-config = { version = "1.10", default-features = false, features = ["behavior-version-latest", "rt-tokio"], optional = true }
aws-sdk-s3 = { version = "1.142", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"], optional = true }
aws-smithy-types = { version = "1.6", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
minify-html = { version = "0.18", optional = true }
ratatui = { version = "0.30", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.53", features = ["rt", "net", "time"], optional = true }
toml = { version = "1.1", optional = true }
zstd = { version = "0.14", optional = true }
